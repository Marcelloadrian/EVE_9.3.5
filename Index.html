<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>EVE SYSTEM</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; }
        #chat-display { 
            white-space: pre; 
            min-height: 200px; 
            border: 1px solid #0f0; 
            padding: 15px; 
            margin-bottom: 10px; 
        }
        .cursor { display: inline-block; background-color: #0f0; width: 10px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; width: 80%; }
        button { background: #0f0; color: #000; border: none; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat-display">INITIALIZING EVE SYSTEM...</div>
    
    <input type="text" id="user-input" placeholder="Masukkan perintah...">
    <button onclick="sendMessage()">EXECUTE</button>

    <script>
        const chatDisplay = document.getElementById("chat-display");

        function typeWriter(text, i) {
            if (i <= text.length) {
                // Menampilkan teks secara bertahap
                chatDisplay.innerHTML = text.substring(0, i) + '<span class="cursor">|</span>';
                // Kecepatan 10ms per karakter
                setTimeout(() => typeWriter(text, i + 1), 10);
            } else {
                chatDisplay.innerHTML = text; // Hapus kursor saat selesai
            }
        }

        function sendMessage() {
            let input = document.getElementById("user-input").value;
            chatDisplay.innerHTML = ""; // Bersihkan layar saat kirim perintah
            
            fetch('/eve', {
                method: 'POST',
                body: JSON.stringify({ message: input }),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                typeWriter(data.reply, 0);
            });
        }
    </script>
</body>
</html>
