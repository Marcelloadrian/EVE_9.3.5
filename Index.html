<!DOCTYPE html>
<html>
<head>
    <title>EVE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #chat { height: 300px; border: 1px solid #0f0; overflow-y: scroll; margin-bottom: 10px; padding: 10px; }
    </style>
</head>
<body>
    <div id="chat">EVE: System Online.</div>
    <input type="text" id="userInput">
    <button onclick="kirimPesan()">Send</button>

    <script>
        function kirimPesan() {
            var msg = document.getElementById('userInput').value;
            var chat = document.getElementById('chat');
            if(!msg) return;

            chat.innerHTML += '<br>> ' + msg;
            document.getElementById('userInput').value = '';

            var xhr = new XMLHttpRequest();
            xhr.open("POST", "/eve", true);
            xhr.setRequestHeader("Content-Type", "application/json");
            
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        var res = JSON.parse(xhr.responseText);
                        chat.innerHTML += '<br>EVE: ' + res.reply;
                    } else {
                        chat.innerHTML += '<br><span style="color:red;">Error ' + xhr.status + '</span>';
                    }
                }
            };
            xhr.send(JSON.stringify({message: msg}));
        }
    </script>
</body>
</html>
