<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>EVE SYSTEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="chat-display">EVE SYSTEM READY...</div>
    
    <div class="controls">
        <input type="text" id="user-input" placeholder="COMMAND...">
        <button id="exec-btn">EXECUTE</button>
    </div>

    <script>
        const chatDisplay = document.getElementById("chat-display");
        const inputField = document.getElementById("user-input");
        const execBtn = document.getElementById("exec-btn");

        function sendMessage() {
            let input = inputField.value.trim();
            if (!input) return;
            
            chatDisplay.innerHTML += `\n\n> ${input}\n`;
            inputField.value = "";
            
            let responseElem = document.createElement("div");
            chatDisplay.appendChild(responseElem);
            
            fetch('/eve', {
                method: 'POST',
                body: JSON.stringify({ message: input }),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                typeWriter(data.reply, 0, responseElem);
            });
        }

        execBtn.onpointerdown = sendMessage;
        inputField.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

        function typeWriter(text, i, element) {
            if (i <= text.length) {
                element.innerHTML = text.substring(0, i) + '<span class="cursor">|</span>';
                chatDisplay.scrollTop = chatDisplay.scrollHeight;
                setTimeout(() => typeWriter(text, i + 1, element), 5);
            } else {
                element.innerHTML = text; 
            }
        }
    </script>
</body>
</html>
