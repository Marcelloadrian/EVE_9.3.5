<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE SYSTEM</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; }
        #chat-display { white-space: pre-wrap; border: 1px solid #0f0; padding: 15px; height: 300px; overflow-y: scroll; margin-bottom: 20px; }
        .input-area { display: flex; gap: 10px; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 15px; flex-grow: 1; outline: none; }
        button { background: #0f0; color: #000; padding: 15px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="chat-display">EVE SYSTEM READY...</div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="COMMAND...">
        <button onclick="sendMessage()">EXECUTE</button>
    </div>

    <script>
        function sendMessage() {
            var input = document.getElementById("user-input");
            var display = document.getElementById("chat-display");
            var msg = input.value;
            
            if(!msg) return;

            display.innerText += "\n> " + msg;
            input.value = "";

            var xhr = new XMLHttpRequest();
            // Ganti URL ini dengan URL Render lo
            xhr.open("POST", "https://eve-9-3-5.onrender.com/eve", true);
            
            // Header ini penting agar cocok dengan request.form.get di Flask
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        display.innerText += "\n" + data.reply;
                        display.scrollTop = display.scrollHeight;
                    } catch(e) {
                        display.innerText += "\nEVE: ERROR PARSING DATA.";
                    }
                } else {
                    display.innerText += "\nEVE: SERVER ERROR " + xhr.status;
                }
            };

            xhr.onerror = function() {
                display.innerText += "\nEVE: NETWORK ERROR.";
            };
            
            // Mengirim data sebagai form (message=isi_input)
            xhr.send("message=" + encodeURIComponent(msg));
        }

        // Support Enter key
        document.getElementById("user-input").onkeydown = function(e) {
            if (e.keyCode === 13) sendMessage();
        };
    </script>
</body>
</html>
