<!DOCTYPE html>
<html>
<head>
    <title>EVE Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #chat { height: 300px; overflow-y: scroll; border: 1px solid #0f0; margin-bottom: 10px; padding: 10px; }
        input { width: 80%; background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <input type="text" id="userInput" placeholder="Tanya EVE...">
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput').value;
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div>> ${input}</div>`;
            
            const response = await fetch('/eve', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: input})
            });
            const data = await response.json();
            chat.innerHTML += `<div>EVE: ${data.reply}</div>`;
            document.getElementById('userInput').value = '';
        }
    </script>
</body>
</html>
