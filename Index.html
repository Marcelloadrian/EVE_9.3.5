<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>EVE SYSTEM</title>
    <style>
        body { 
            background: #000; color: #0f0; font-family: 'Courier New', monospace; 
            margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column;
        }

        #chat-display { 
            white-space: pre-wrap; flex-grow: 1; padding: 20px; 
            border: 2px solid #0f0; font-size: 18px; overflow-y: auto; margin-bottom: 20px;
        }

        .controls { display: flex; gap: 10px; width: 100%; padding-bottom: 20px; }

        input { 
            background: #000; color: #0f0; border: 2px solid #0f0; 
            padding: 20px; flex-grow: 1; font-size: 18px; outline: none;
        }

        button { 
            background: #0f0; color: #000; border: none; padding: 20px 30px; 
            font-size: 18px; font-weight: bold; cursor: pointer;
        }

        button:active { background: #080; }
    </style>
</head>
<body>

    <div id="chat-display">EVE SYSTEM ONLINE.</div>
    
    <div class="controls">
        <input type="text" id="user-input" placeholder="COMMAND...">
        <button id="exec-btn">EXECUTE</button>
    </div>

    <script>
        const chatDisplay = document.getElementById("chat-display");
        const inputField = document.getElementById("user-input");
        const execBtn = document.getElementById("exec-btn");

        // Fungsi typewriter super ringan tanpa CSS animation
        function typeWriter(text, element, speed) {
            let i = 0;
            element.innerHTML = ""; // Bersihkan kontainer
            function typing() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, speed);
                    chatDisplay.scrollTop = chatDisplay.scrollHeight;
                }
            }
            typing();
        }

        function sendMessage() {
            let input = inputField.value.trim();
            if (!input) return;
            
            chatDisplay.innerHTML += `\n\n> ${input}\n`;
            inputField.value = "";
            
            let responseElem = document.createElement("div");
            chatDisplay.appendChild(responseElem);
            
            fetch('/eve', {
                method: 'POST',
                body: JSON.stringify({ message: input }),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                // Panggil fungsi typewriter dengan speed 10ms (sangat ringan)
                typeWriter("EVE: " + data.reply, responseElem, 10);
            });
        }

        execBtn.onclick = sendMessage;
        inputField.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
