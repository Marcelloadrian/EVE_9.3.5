<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVE SYSTEM</title>
    <style>
        * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
        }

        /* ── HEADER ───────────────────────────── */
        #header {
            height: 30px;
            line-height: 30px;
            border-bottom: 1px solid #0f0;
            padding: 0 12px;
            overflow: hidden;
            letter-spacing: 3px;
            font-size: 11px;
        }
        #header .title { float: left; }
        #header .clock { float: right; }
        #header:after { content: ""; display: table; clear: both; }

        /* ── GRID: 2 cols, 2 rows ─────────────── */
        /* 
           [  CHAT (tall)  ] [ PHOTO       ]
           [               ] [ JADWAL      ]
           [               ] [ NOTES       ]
        */
        #grid {
            position: absolute;
            top: 31px;
            left: 0; right: 0; bottom: 0;
            overflow: hidden;
        }

        /* Left column: full height */
        #col-left {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 52%;
            border-right: 1px solid #0f0;
        }

        /* Right column: 3 stacked panels */
        #col-right {
            position: absolute;
            top: 0; right: 0; bottom: 0;
            left: 52%;
        }

        /* ── PANEL SHARED ─────────────────────── */
        .panel-title {
            background: #0f0;
            color: #000;
            padding: 3px 10px;
            font-size: 10px;
            letter-spacing: 3px;
            font-weight: bold;
            height: 22px;
            line-height: 16px;
        }

        /* ── CHAT PANEL ───────────────────────── */
        #chat-panel {
            position: absolute;
            top: 0; left: 0; right: 0;
            bottom: 46px; /* input area height */
        }
        #chat-display {
            position: absolute;
            top: 22px; /* title height */
            left: 0; right: 0; bottom: 0;
            overflow-y: scroll;
            padding: 8px;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.6;
            word-break: break-word;
        }

        /* Input row pinned to bottom of left col */
        #chat-input-row {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 46px;
            border-top: 1px solid #0f0;
            overflow: hidden;
        }
        #user-input {
            float: left;
            width: 76%;
            height: 46px;
            background: #000;
            color: #0f0;
            border: none;
            border-right: 1px solid #0f0;
            padding: 0 10px;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
        }
        #send-btn {
            float: left;
            width: 24%;
            height: 46px;
            background: #0f0;
            color: #000;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        #chat-input-row:after { content: ""; display: table; clear: both; }

        /* ── RIGHT PANELS ─────────────────────── */
        /* Photo: top 42% of right col */
        #panel-photo {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 42%;
            border-bottom: 1px solid #0f0;
        }
        #photo-body {
            position: absolute;
            top: 22px; left: 0; right: 0; bottom: 0;
            overflow: hidden;
        }
        #photo-frame {
            height: 58%;
            background: #030;
            text-align: center;
            overflow: hidden;
        }
        #photo-frame img {
            max-width: 100%;
            max-height: 100%;
            display: block;
            margin: 0 auto;
        }
        #photo-caption {
            font-size: 9px;
            color: #090;
            letter-spacing: 2px;
            padding: 3px 8px;
            height: 18px;
            overflow: hidden;
            white-space: nowrap;
        }
        #photo-controls {
            overflow: hidden;
            border-top: 1px solid #030;
        }
        #photo-controls button, #photo-controls a {
            display: block;
            float: left;
            width: 33.33%;
            background: #000;
            color: #0f0;
            border: none;
            border-right: 1px solid #030;
            padding: 5px 2px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 9px;
            letter-spacing: 1px;
            text-align: center;
            text-decoration: none;
            line-height: 1.4;
        }
        #photo-controls .del-btn { color: #f44; }
        #photo-controls button:last-child,
        #photo-controls a:last-child { border-right: none; }
        #photo-controls:after { content: ""; display: table; clear: both; }

        /* Jadwal: middle 33% */
        #panel-jadwal {
            position: absolute;
            left: 0; right: 0;
            top: 42%;
            height: 33%;
            border-bottom: 1px solid #0f0;
        }
        #jadwal-body {
            position: absolute;
            top: 22px; left: 0; right: 0; bottom: 0;
            overflow-y: scroll;
            padding: 6px 8px;
        }
        .jadwal-item {
            border-bottom: 1px solid #020;
            padding: 3px 0;
            font-size: 11px;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
        }
        .jadwal-item .time { color: #0a0; margin-right: 8px; }
        .empty-msg { color: #040; font-size: 10px; font-style: italic; }

        /* Notes: bottom 25% */
        #panel-notes {
            position: absolute;
            left: 0; right: 0;
            top: 75%;
            bottom: 0;
        }
        #notes-body {
            position: absolute;
            top: 22px; left: 0; right: 0; bottom: 0;
            overflow-y: scroll;
            padding: 6px 8px;
        }
        .notes-item {
            border-bottom: 1px solid #020;
            padding: 3px 0;
            font-size: 11px;
            color: #0c0;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
        }

        /* ── SCROLLBAR ────────────────────────── */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #060; }
    </style>
</head>
<body>

<!-- HEADER -->
<div id="header">
    <span class="title">[ EVE SYSTEM v2.0 ]</span>
    <span class="clock" id="clock">--:--:--</span>
</div>

<!-- GRID -->
<div id="grid">

    <!-- LEFT: CHAT -->
    <div id="col-left">
        <div id="chat-panel">
            <div class="panel-title">// TERMINAL</div>
            <div id="chat-display">EVE SYSTEM READY...
TYPE A COMMAND OR SPEAK FREELY.</div>
        </div>
        <div id="chat-input-row">
            <input type="text" id="user-input" placeholder="COMMAND...">
            <button id="send-btn">EXEC</button>
        </div>
    </div>

    <!-- RIGHT COL -->
    <div id="col-right">

        <!-- PHOTO -->
        <div id="panel-photo">
            <div class="panel-title">// PHOTO FRAME</div>
            <div id="photo-body">
                <div id="photo-frame">
                    <img id="photo-img" src="" alt="">
                </div>
                <div id="photo-caption">NO PHOTOS LOADED</div>
                <div id="photo-controls">
                    <button onclick="prevPhoto()">&#9664; PREV</button>
                    <button onclick="nextPhoto()">NEXT &#9654;</button>
                    <button class="del-btn" onclick="deletePhoto()">DELETE</button>
                </div>
                <a href="/upload" id="upload-link" style="display:block;text-align:center;color:#0f0;text-decoration:none;font-size:9px;letter-spacing:2px;padding:4px;border-top:1px solid #030;">[ + UPLOAD ]</a>
            </div>
        </div>

        <!-- JADWAL -->
        <div id="panel-jadwal">
            <div class="panel-title">// JADWAL</div>
            <div id="jadwal-body">
                <span class="empty-msg">LOADING...</span>
            </div>
        </div>

        <!-- NOTES -->
        <div id="panel-notes">
            <div class="panel-title">// NOTES</div>
            <div id="notes-body">
                <span class="empty-msg">LOADING...</span>
            </div>
        </div>

    </div>
</div>


<script>
// ── CLOCK ──────────────────────────────────────────────────
function updateClock() {
    var d = new Date();
    var h = d.getHours(); var m = d.getMinutes(); var s = d.getSeconds();
    h = h < 10 ? "0"+h : ""+h;
    m = m < 10 ? "0"+m : ""+m;
    s = s < 10 ? "0"+s : ""+s;
    document.getElementById("clock").innerHTML = h+":"+m+":"+s;
}
setInterval(updateClock, 1000);
updateClock();

// ── CHAT ───────────────────────────────────────────────────
function sendMessage() {
    var input = document.getElementById("user-input");
    var display = document.getElementById("chat-display");
    var msg = input.value;
    if (!msg) return;

    display.innerText += "\n> " + msg;
    input.value = "";
    display.scrollTop = display.scrollHeight;

    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/eve", true);
    xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    display.innerText += "\n" + data.reply;
                    var lower = msg.toLowerCase();
                    if (lower.indexOf("jadwal") > -1 || lower.indexOf("pasang") > -1 ||
                        lower.indexOf("hapus") > -1 || lower.indexOf("reset") > -1 ||
                        lower.indexOf("note") > -1 || lower.indexOf("catat") > -1 ||
                        lower.indexOf("status") > -1 || lower.indexOf("dashboard") > -1) {
                        loadDashboard();
                    }
                } catch(e) {
                    display.innerText += "\nEVE: ERROR PARSING DATA.";
                }
            } else {
                display.innerText += "\nEVE: SERVER ERROR " + xhr.status;
            }
            display.scrollTop = display.scrollHeight;
        }
    };
    xhr.onerror = function() {
        display.innerText += "\nEVE: NETWORK ERROR.";
        display.scrollTop = display.scrollHeight;
    };
    xhr.send("message=" + encodeURIComponent(msg));
}

document.getElementById("user-input").onkeydown = function(e) {
    var key = e.keyCode || e.which;
    if (key === 13) sendMessage();
};
document.getElementById("send-btn").onclick = sendMessage;

// ── DASHBOARD (jadwal + notes) ─────────────────────────────
function loadDashboard() {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/eve", true);
    xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            try {
                var data = JSON.parse(xhr.responseText);
                parseDashboard(data.reply);
            } catch(e) {}
        }
    };
    xhr.send("message=dashboard");
}

function parseDashboard(reply) {
    // ── JADWAL ──
    var jadwalBody = document.getElementById("jadwal-body");
    var lines = reply.split("\n");
    var items = [];
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.indexOf("│") > -1 && line.indexOf(":") > -1) {
            var parts = line.split("│");
            if (parts.length >= 3) {
                var t = parts[1].replace(/\s/g, "");
                var task = parts[2].replace(/^\s+|\s+$/g, "");
                if (t && t !== "JAM" && task && task !== "KEGIATAN") {
                    items.push({time: t, task: task});
                }
            }
        }
    }
    if (items.length === 0) {
        jadwalBody.innerHTML = '<span class="empty-msg">JADWAL KOSONG</span>';
    } else {
        var html = "";
        for (var j = 0; j < items.length; j++) {
            html += '<div class="jadwal-item"><span class="time">' + items[j].time + '</span>' + items[j].task + '</div>';
        }
        jadwalBody.innerHTML = html;
    }

    // ── NOTES ──
    var notesBody = document.getElementById("notes-body");
    var sec = reply.split("[ARSIP NOTES]");
    var notes = [];
    if (sec.length > 1) {
        var nl = sec[1].split("\n");
        for (var k = 0; k < nl.length; k++) {
            var n = nl[k].replace(/^\s*-\s*/, "").trim();
            if (n && n !== "KOSONG") notes.push(n);
        }
    }
    if (notes.length === 0) {
        notesBody.innerHTML = '<span class="empty-msg">NOTES KOSONG</span>';
    } else {
        var nhtml = "";
        for (var m = 0; m < notes.length; m++) {
            nhtml += '<div class="notes-item">&#8250; ' + notes[m] + '</div>';
        }
        notesBody.innerHTML = nhtml;
    }
}

loadDashboard();

// ── PHOTOS ─────────────────────────────────────────────────
var photoList = [];
var photoIndex = 0;

function loadPhotos() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/get-photos", true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            try {
                var data = JSON.parse(xhr.responseText);
                photoList = data.photos || [];
                if (photoList.length > 0) {
                    if (photoIndex >= photoList.length) photoIndex = 0;
                    showPhoto(photoIndex);
                } else {
                    document.getElementById("photo-img").src = "";
                    document.getElementById("photo-caption").innerHTML = "NO PHOTOS";
                }
            } catch(e) {}
        }
    };
    xhr.send();
}

function showPhoto(idx) {
    if (photoList.length === 0) return;
    var img = document.getElementById("photo-img");
    var cap = document.getElementById("photo-caption");
    img.src = photoList[idx];
    var parts = photoList[idx].split("/");
    cap.innerHTML = (idx+1) + "/" + photoList.length + "  " + parts[parts.length-1].toUpperCase();
}

function nextPhoto() {
    if (photoList.length === 0) return;
    photoIndex = (photoIndex + 1) % photoList.length;
    showPhoto(photoIndex);
}

function prevPhoto() {
    if (photoList.length === 0) return;
    photoIndex = (photoIndex - 1 + photoList.length) % photoList.length;
    showPhoto(photoIndex);
}

function deletePhoto() {
    if (photoList.length === 0) return;
    var pwd = prompt("PASSWORD:");
    if (!pwd) return;
    var url = photoList[photoIndex];
    var parts = url.split("/");
    var filename = parts[parts.length - 1];
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/delete-photo", true);
    xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            try {
                var data = JSON.parse(xhr.responseText);
                if (data.success) {
                    photoList.splice(photoIndex, 1);
                    if (photoIndex >= photoList.length) photoIndex = 0;
                    if (photoList.length > 0) {
                        showPhoto(photoIndex);
                    } else {
                        document.getElementById("photo-img").src = "";
                        document.getElementById("photo-caption").innerHTML = "NO PHOTOS";
                    }
                } else {
                    alert(data.reply);
                }
            } catch(e) {}
        }
    };
    xhr.send("password=" + encodeURIComponent(pwd) + "&filename=" + encodeURIComponent(filename));
}

loadPhotos();

// Auto-refresh photos every 30s
var refreshCount = 30;
setInterval(function() {
    refreshCount -= 1;
    if (refreshCount <= 0) {
        loadPhotos();
        refreshCount = 30;
    }
}, 1000);
</script>

</body>
</html>
