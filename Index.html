<div id="chat-display" style="white-space: pre-wrap; font-family: 'Courier New', monospace; background: #000; color: #0f0; padding: 20px; min-height: 200px;"></div>

<script>
    function typeWriter(text, i, fnCallback) {
        if (i < text.length) {
            document.getElementById("chat-display").innerHTML = text.substring(0, i + 1) + '<span class="cursor">|</span>';
            setTimeout(function() {
                typeWriter(text, i + 1, fnCallback);
            }, 15); // Kecepatan ketik (15ms per karakter)
        } else if (typeof fnCallback == 'function') {
            setTimeout(fnCallback, 700);
        }
    }

    function sendMessage() {
        let input = document.getElementById("user-input").value;
        fetch('/eve', {
            method: 'POST',
            body: JSON.stringify({ message: input }),
            headers: { 'Content-Type': 'application/json' }
        })
        .then(response => response.json())
        .then(data => {
            // Panggil efek ketik dengan teks dari server
            typeWriter(data.reply, 0);
        });
    }
</script>

<style>
    .cursor {
        display: inline-block;
        background-color: #0f0;
        width: 10px;
        animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
