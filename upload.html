<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE — UPLOAD</title>
    <style>
        * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            font-size: 13px;
        }

        #header {
            border: 1px solid #0f0;
            padding: 8px 14px;
            margin-bottom: 20px;
            letter-spacing: 4px;
            font-size: 11px;
            overflow: hidden;
        }
        #header .title { float: left; }
        #header .back  { float: right; color: #0f0; text-decoration: none; font-size: 11px; }
        #header:after  { content: ""; display: table; clear: both; }

        .panel {
            border: 1px solid #0f0;
            max-width: 480px;
            margin: 0 auto;
        }
        .panel-title {
            background: #0f0;
            color: #000;
            padding: 5px 12px;
            font-size: 10px;
            letter-spacing: 3px;
            font-weight: bold;
        }
        .panel-body { padding: 16px; }

        .field-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #0a0;
            margin-bottom: 4px;
        }

        input[type="password"],
        input[type="file"] {
            width: 100%;
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            outline: none;
            margin-bottom: 14px;
            display: block;
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }

        /* File input styling for older Safari */
        input[type="file"]::-webkit-file-upload-button {
            background: #030;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 4px 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            cursor: pointer;
        }

        #upload-btn {
            width: 100%;
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
        }

        #status-msg {
            margin-top: 14px;
            padding: 10px;
            border: 1px solid #030;
            font-size: 11px;
            line-height: 1.6;
            min-height: 36px;
            color: #0a0;
            white-space: pre-wrap;
        }
        #status-msg.error { color: #f00; border-color: #300; }
        #status-msg.success { color: #0f0; border-color: #0a0; }

        /* Preview */
        #preview-wrap { margin-bottom: 14px; text-align: center; }
        #preview-wrap img {
            max-width: 100%;
            max-height: 160px;
            border: 1px solid #030;
            display: none;
        }

        .divider {
            border: none;
            border-top: 1px solid #030;
            margin: 14px 0;
        }

        .note {
            font-size: 10px;
            color: #060;
            letter-spacing: 1px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div id="header">
    <span class="title">[ EVE / UPLOAD MODULE ]</span>
    <a href="/" id="back-link" class="back">&#9664; BACK</a>
</div>

<div class="panel">
    <div class="panel-title">// SECURE FILE UPLOAD</div>
    <div class="panel-body">

        <div class="field-label">PASSWORD</div>
        <input type="password" id="pwd-input" placeholder="ENTER ACCESS KEY">

        <div class="field-label">SELECT IMAGE</div>
        <input type="file" id="file-input" accept="image/*">

        <div id="preview-wrap">
            <img id="preview-img" src="" alt="preview">
        </div>

        <button id="upload-btn">UPLOAD FILE</button>

        <div id="status-msg">AWAITING INPUT...</div>

        <hr class="divider">
        <div class="note">
            SUPPORTED: JPG / PNG / GIF / WEBP
            MAX SIZE: 16MB
            FILES STORED IN: /static/uploads/
        </div>

    </div>
</div>


<script>
// ── IMAGE PREVIEW ──────────────────────────────────────────────────────────
var fileInput = document.getElementById("file-input");
var previewImg = document.getElementById("preview-img");

fileInput.onchange = function() {
    var file = fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        previewImg.src = e.target.result;
        previewImg.style.display = "block";
    };
    reader.readAsDataURL(file);
};


// ── UPLOAD ─────────────────────────────────────────────────────────────────
var uploadBtn = document.getElementById("upload-btn");
var statusMsg = document.getElementById("status-msg");

uploadBtn.onclick = function() {
    var pwd  = document.getElementById("pwd-input").value;
    var file = fileInput.files[0];
    var status = document.getElementById("status-msg");

    status.className = "";
    status.innerHTML = "PROCESSING...";

    if (!pwd) {
        status.className = "error";
        status.innerHTML = "EVE: ACCESS DENIED. NO PASSWORD.";
        return;
    }
    if (!file) {
        status.className = "error";
        status.innerHTML = "EVE: NO FILE SELECTED.";
        return;
    }

    var formData = new FormData();
    formData.append("password", pwd);
    formData.append("photo", file);

    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/upload-file", true);

    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200 || xhr.status === 201) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.success) {
                        status.className = "success";
                        status.innerHTML = data.reply + "\n\nFILE: " + file.name.toUpperCase();
                        // Clear fields after success
                        fileInput.value = "";
                        document.getElementById("pwd-input").value = "";
                        previewImg.style.display = "none";
                        previewImg.src = "";
                    } else {
                        status.className = "error";
                        status.innerHTML = data.reply;
                    }
                } catch (e) {
                    status.className = "error";
                    status.innerHTML = "EVE: PARSE ERROR.";
                }
            } else if (xhr.status === 403) {
                status.className = "error";
                try {
                    var d = JSON.parse(xhr.responseText);
                    status.innerHTML = d.reply;
                } catch(e) {
                    status.innerHTML = "EVE: ACCESS DENIED.";
                }
            } else {
                status.className = "error";
                status.innerHTML = "EVE: SERVER ERROR " + xhr.status;
            }
        }
    };

    xhr.onerror = function() {
        status.className = "error";
        status.innerHTML = "EVE: NETWORK ERROR.";
    };

    xhr.send(formData);
};

// Enter key on password field triggers upload
document.getElementById("pwd-input").onkeydown = function(e) {
    var key = e.keyCode || e.which;
    if (key === 13) uploadBtn.onclick();
};
</script>

</body>
</html>
